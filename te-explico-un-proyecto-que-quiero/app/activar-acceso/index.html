<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear contraseña - Klinia</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var token = params.get("token") || params.get("access_token") || "";
        var target = "/?access_token=" + encodeURIComponent(token);
        window.location.replace(token ? target : "/?access_token=");
      }());
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f1;
        color: #202621;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d9ded7;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(16, 35, 31, 0.12);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #69746c;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/klinia-logo.svg" alt="Klinia" />
      <h1>Crear contraseña</h1>
      <p>Preparando la pantalla segura de activación...</p>
    </main>
  </body>
</html>
