<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klinia sin conexion</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f5f1; color: #202621; }
      main { width: min(440px, calc(100% - 32px)); border: 1px solid #d9ded7; border-radius: 14px; background: #fff; padding: 28px; box-shadow: 0 16px 40px rgba(28, 39, 33, 0.1); }
      img { width: 58px; height: 58px; }
      h1 { margin: 18px 0 8px; font-size: 26px; }
      p { margin: 0; color: #69746c; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/klinia-logo.svg" alt="Klinia" />
      <h1>Klinia esta sin conexion</h1>
      <p>Revisa la conexion e intenta abrir la aplicacion de nuevo. La version instalada conserva la interfaz basica para poder volver rapido al servicio.</p>
    </main>
  </body>
</html>
