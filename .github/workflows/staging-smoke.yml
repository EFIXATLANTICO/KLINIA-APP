name: Isolated staging and preview read-only verification

on:
  push:
    branches:
      - "codex/google-calendar-booking-20260907"

permissions:
  contents: read

jobs:
  staging-read-only:
    if: github.event.head_commit.message == 'Verify preview uses staging only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_BASE_URL: https://klinia-api-staging.onrender.com
      STAGING_PREVIEW_URL: https://klinia-app-git-codex-google-calendar-b-aa1a31-klinia-s-projects.vercel.app
    steps:
      - name: Verify staging health and public booking data without writes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta

          base_url = os.environ["STAGING_BASE_URL"].rstrip("/")
          preview_url = os.environ["STAGING_PREVIEW_URL"].rstrip("/")
          if base_url != "https://klinia-api-staging.onrender.com":
              raise SystemExit("Safety check failed: unexpected staging API URL")
          if preview_url != "https://klinia-app-git-codex-google-calendar-b-aa1a31-klinia-s-projects.vercel.app":
              raise SystemExit("Safety check failed: unexpected Vercel Preview URL")

          def get_json(path):
              url = base_url + path
              if not url.startswith(base_url + "/"):
                  raise RuntimeError("Safety check failed: request escaped staging origin")
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read().decode("utf-8")
                      if response.status != 200:
                          raise RuntimeError(f"GET {path} returned HTTP {response.status}")
                      return json.loads(raw)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")[:800]
                  raise RuntimeError(f"GET {path} returned HTTP {error.code}: {detail}") from error

          health = None
          for attempt in range(12):
              try:
                  health = get_json("/health")
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)

          if health.get("ok") is not True:
              raise RuntimeError(f"Staging health is not OK: {health}")
          if health.get("app") != "Klinia Staging" or health.get("env") != "staging":
              raise RuntimeError(f"Unexpected staging identity: {health}")

          public_booking = get_json("/public/bookings/clinica-google-test")
          if public_booking.get("clinic", {}).get("name") != "CLINICA GOOGLE TEST":
              raise RuntimeError("Public booking data is not isolated to CLINICA GOOGLE TEST")

          services = public_booking.get("services", [])
          practitioners = public_booking.get("practitioners", [])
          physiotherapy = next((item for item in services if item.get("name") == "Fisioterapia"), None)
          review = next((item for item in services if item.get("name") == "Revisión"), None)
          practitioner = next((item for item in practitioners if item.get("name") == "ANGEL TEST"), None)
          if not physiotherapy or physiotherapy.get("duration_minutes") != 60:
              raise RuntimeError("Fisioterapia 60 min fixture was not found")
          if not review or review.get("duration_minutes") != 30:
              raise RuntimeError("Revisión 30 min fixture was not found")
          if not practitioner:
              raise RuntimeError("ANGEL TEST fixture was not found")

          candidate = date.today() + timedelta(days=1)
          while candidate.weekday() >= 5:
              candidate += timedelta(days=1)
          availability_path = (
              "/public/bookings/clinica-google-test/availability?booking_date="
              + candidate.isoformat()
              + "&service_id=" + urllib.parse.quote(physiotherapy["id"])
              + "&practitioner_id=" + urllib.parse.quote(practitioner["id"])
          )
          availability = get_json(availability_path)
          if availability.get("date") != candidate.isoformat():
              raise RuntimeError("Availability endpoint returned an unexpected date")
          if not availability.get("slots"):
              raise RuntimeError("Staging availability returned no slots for the configured working day")

          forbidden_keys = {
              "patient", "patient_name", "event_title", "event_description",
              "attendees", "location", "diagnosis", "clinical_notes",
          }
          serialized_public = json.dumps(
              {"booking": public_booking, "availability": availability},
              ensure_ascii=False,
          ).lower()
          leaked = sorted(key for key in forbidden_keys if f'"{key}"' in serialized_public)
          if leaked:
              raise RuntimeError(f"Public payload exposes forbidden fields: {leaked}")

          def get_preview_text(path):
              url = preview_url + path
              if not url.startswith(preview_url + "/"):
                  raise RuntimeError("Safety check failed: request escaped Preview origin")
              request = urllib.request.Request(url, headers={"Accept": "*/*"}, method="GET")
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.status, response.read().decode("utf-8"), dict(response.headers.items())

          booking_page_status, booking_page_html, booking_page_headers = get_preview_text(
              "/reservar/clinica-google-test"
          )
          app_js_status, app_js, _ = get_preview_text("/app.js")
          booking_js_status, booking_js, _ = get_preview_text("/reservar/booking.js")
          if (booking_page_status, app_js_status, booking_js_status) != (200, 200, 200):
              raise RuntimeError("Preview resources did not return HTTP 200")
          if "https://klinia-api-staging.onrender.com" not in app_js:
              raise RuntimeError("Preview app.js does not contain the staging API")
          if "https://klinia-api-staging.onrender.com" not in booking_js:
              raise RuntimeError("Preview booking.js does not contain the staging API")
          app_preview_guard = app_js.find('window.location.hostname.endsWith(".vercel.app")')
          app_override = app_js.find('window.KLINIA_API_BASE_URL', app_js.find("function backendApiBaseUrl"))
          if app_preview_guard < 0 or app_override < 0 or app_preview_guard > app_override:
              raise RuntimeError("Preview app resolver does not prioritize the staging host guard")
          booking_preview_guard = booking_js.find('window.location.hostname.endsWith(".vercel.app")')
          booking_override = booking_js.find("window.KLINIA_API_BASE_URL")
          if booking_preview_guard < 0 or booking_override < 0 or booking_preview_guard > booking_override:
              raise RuntimeError("Preview booking resolver does not prioritize the staging host guard")

          preflight = urllib.request.Request(
              base_url + "/public/bookings/clinica-google-test",
              headers={
                  "Origin": preview_url,
                  "Access-Control-Request-Method": "GET",
              },
              method="OPTIONS",
          )
          with urllib.request.urlopen(preflight, timeout=60) as response:
              allowed_origin = response.headers.get("Access-Control-Allow-Origin")
              if response.status != 200 or allowed_origin != preview_url:
                  raise RuntimeError(
                      f"Staging CORS rejected Preview origin: status={response.status} origin={allowed_origin}"
                  )

          result = {
              "health": {
                  "http_status": 200,
                  "ok": health.get("ok"),
                  "app": health.get("app"),
                  "env": health.get("env"),
                  "backend_setup_status": health.get("backend_setup_status"),
              },
              "clinic": {"name": public_booking["clinic"]["name"]},
              "practitioner": {"id": practitioner["id"], "name": practitioner["name"]},
              "services": [
                  {"id": physiotherapy["id"], "name": physiotherapy["name"], "duration_minutes": physiotherapy["duration_minutes"]},
                  {"id": review["id"], "name": review["name"], "duration_minutes": review["duration_minutes"]},
              ],
              "booking": {
                  "slug": "clinica-google-test",
                  "enabled": True,
              },
              "availability": {
                  "date": availability.get("date"),
                  "slot_count": len(availability.get("slots", [])),
              },
              "privacy": {"forbidden_fields_exposed": []},
              "preview": {
                  "url": preview_url,
                  "booking_page_http_status": booking_page_status,
                  "app_js_http_status": app_js_status,
                  "booking_js_http_status": booking_js_status,
                  "api_resolver": "staging host guard has priority",
                  "cors_allowed_origin": allowed_origin,
              },
              "safety": {
                  "method": "GET and CORS OPTIONS only",
                  "api_origin": base_url,
                  "production_requests": 0,
              },
          }
          with open("staging-read-only-result.json", "w", encoding="utf-8") as output:
              json.dump(result, output, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Publish sanitized staging report
        uses: actions/upload-artifact@v4
        with:
          name: staging-read-only-result
          path: staging-read-only-result.json
          if-no-files-found: error
          retention-days: 7
