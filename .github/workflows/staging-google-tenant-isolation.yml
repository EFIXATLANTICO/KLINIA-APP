name: One-time staging Google tenant isolation

on:
  pull_request:
    paths:
      - ".github/workflows/staging-google-tenant-isolation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare public FreeBusy isolation
        env:
          STAGING_API: https://klinia-api-staging.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import date

          api = os.environ["STAGING_API"].rstrip("/")
          if api != "https://klinia-api-staging.onrender.com" or "api.kliniasolutions.com" in api:
              raise SystemExit("Production safety guard failed")

          def get(path):
              url = api + path
              if not url.startswith("https://klinia-api-staging.onrender.com/"):
                  raise AssertionError("Request escaped staging")
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8")
                  return error.code, json.loads(raw) if raw else {}

          def availability(slug):
              status, config = get(f"/public/bookings/{slug}")
              if status != 200:
                  raise AssertionError(f"Public config {slug} returned {status}")
              if not config.get("services"):
                  raise AssertionError(f"No public service for {slug}")
              params = {
                  "service_id": config["services"][0]["id"],
                  "booking_date": date.today().isoformat(),
              }
              if config["settings"]["allow_professional_selection"]:
                  if not config.get("practitioners"):
                      raise AssertionError(f"No public practitioner for {slug}")
                  params["practitioner_id"] = config["practitioners"][0]["id"]
              query = urllib.parse.urlencode(params)
              status, payload = get(f"/public/bookings/{slug}/availability?{query}")
              if status != 200:
                  raise AssertionError(f"Availability {slug} returned {status}: {payload.get('detail')}")
              forbidden = ("summary", "description", "attendees", "location", "event")
              serialized = json.dumps(payload).lower()
              if any(item in serialized for item in forbidden):
                  raise AssertionError("FreeBusy response exposed event metadata")
              return {item["start"] for item in payload.get("slots", [])}

          google_slots = availability("clinica-google-test")
          independent_slots = availability("clinica-google-test-b")
          if "11:00" in google_slots:
              raise AssertionError("Google-connected clinic still exposes the private 11:00 busy slot")
          if "11:00" not in independent_slots:
              raise AssertionError("Clinic B was affected by clinic A Google busy time")

          print("STAGING_GOOGLE_TENANT_ISOLATION=" + json.dumps({
              "google_clinic_1100_available": False,
              "independent_clinic_1100_available": True,
              "event_metadata_exposed": False,
              "production_requests": 0,
          }, sort_keys=True))
          PY
