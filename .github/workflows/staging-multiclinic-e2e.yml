name: One-time staging multi-clinic E2E

on:
  pull_request:
    paths:
      - ".github/workflows/staging-multiclinic-e2e.yml"

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise isolated staging API
        env:
          STAGING_API: https://klinia-api-staging.onrender.com
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import secrets
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta

          API = os.environ["STAGING_API"].rstrip("/")
          if API != "https://klinia-api-staging.onrender.com":
              raise SystemExit("Refusing to run outside the exact staging API")
          if "api.kliniasolutions.com" in API or "staging" not in API:
              raise SystemExit("Production safety guard failed")

          def request(method, path, data=None, token=None):
              url = API + path
              if not url.startswith("https://klinia-api-staging.onrender.com/"):
                  raise AssertionError("Request escaped staging")
              headers = {"Accept": "application/json"}
              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8")
                  try:
                      payload = json.loads(raw) if raw else None
                  except ValueError:
                      payload = {"detail": raw[:300]}
                  return error.code, payload

          def expect(method, path, statuses, data=None, token=None):
              status, payload = request(method, path, data, token)
              if status not in statuses:
                  detail = payload.get("detail") if isinstance(payload, dict) else payload
                  raise AssertionError(f"{method} {path}: expected {statuses}, got {status}: {detail}")
              return status, payload

          for slug in ("clinica-google-test-a", "clinica-google-test-b"):
              status, _ = request("GET", f"/public/bookings/{slug}")
              if status != 404:
                  raise SystemExit(f"Refusing to reuse existing staging slug {slug}")

          health_status, health = expect("GET", "/health", {200})
          if not isinstance(health, dict):
              raise AssertionError("Unexpected health payload")

          password_a = "Aa9!" + secrets.token_urlsafe(24)
          password_b = "Bb9!" + secrets.token_urlsafe(24)
          print(f"::add-mask::{password_a}")
          print(f"::add-mask::{password_b}")

          clinics = {}
          for key, password in (("a", password_a), ("b", password_b)):
              upper = key.upper()
              _, registration = expect(
                  "POST",
                  "/auth/register-clinic",
                  {201},
                  {
                      "clinic_name": f"CLINICA GOOGLE TEST {upper}",
                      "email": f"owner-google-test-{key}-20260908@example.com",
                      "clinic_email": f"clinic-google-test-{key}-20260908@example.com",
                      "password": password,
                      "phone": "60000000" + ("1" if key == "a" else "2"),
                      "owner_name": f"DIRECCION TEST {upper}",
                      "plan": "trial",
                      "working_days": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                      "opening_start": "09:00",
                      "opening_end": "14:00",
                  },
              )
              token = registration.get("access_token")
              clinic_id = registration.get("clinic_id")
              if not token or not clinic_id:
                  raise AssertionError("Registration did not return isolated credentials")
              print(f"::add-mask::{token}")
              _, me = expect("GET", "/me", {200}, token=token)
              if me.get("clinic_id") != clinic_id:
                  raise AssertionError("Authenticated clinic mismatch")

              _, defaults = expect("GET", "/integrations/google-calendar", {200}, token=token)
              if defaults["calendar"]["connected"] or defaults["booking"]["enabled"]:
                  raise AssertionError("New clinic did not default to disconnected/disabled")

              _, practitioner = expect(
                  "POST",
                  "/practitioners",
                  {201},
                  {
                      "name": f"ANGEL TEST {upper}",
                      "specialty": "Fisioterapia",
                      "color": "#168776",
                      "commission_rate": 0,
                      "monthly_target_cents": 0,
                      "availability_start": "09:00",
                      "availability_end": "14:00",
                      "active": True,
                  },
                  token,
              )
              _, room = expect(
                  "POST",
                  "/rooms",
                  {201},
                  {"name": f"SALA TEST {upper}", "type": "Consulta", "active": True},
                  token,
              )
              _, service = expect(
                  "POST",
                  "/services",
                  {201},
                  {
                      "name": f"Fisioterapia TEST {upper}",
                      "duration_minutes": 60,
                      "price_cents": 5000 if key == "a" else 6000,
                      "type": "individual",
                      "capacity": 1,
                      "active": True,
                  },
                  token,
              )
              slug = f"clinica-google-test-{key}"
              _, configured = expect(
                  "PUT",
                  "/integrations/online-booking",
                  {200},
                  {
                      "enabled": True,
                      "slug": slug,
                      "min_notice_minutes": 0,
                      "max_days_ahead": 30,
                      "min_cancellation_minutes": 1440,
                      "buffer_minutes": 0,
                      "automatic_confirmation": True,
                      "allow_professional_selection": True,
                      "show_price": True,
                      "show_duration": True,
                      "service_ids": [service["id"]],
                      "practitioner_ids": [practitioner["id"]],
                  },
                  token,
              )
              if configured["booking"]["slug"] != slug:
                  raise AssertionError("Clinic slug was not persisted independently")
              clinics[key] = {
                  "id": clinic_id,
                  "token": token,
                  "slug": slug,
                  "practitioner": practitioner,
                  "room": room,
                  "service": service,
              }

          a, b = clinics["a"], clinics["b"]
          for key, own, other in (("a", a, b), ("b", b, a)):
              _, page = expect("GET", f"/public/bookings/{own['slug']}", {200})
              service_ids = {item["id"] for item in page["services"]}
              practitioner_ids = {item["id"] for item in page["practitioners"]}
              if service_ids != {own["service"]["id"]} or other["service"]["id"] in service_ids:
                  raise AssertionError(f"Service catalog leaked across clinic {key}")
              if practitioner_ids != {own["practitioner"]["id"]} or other["practitioner"]["id"] in practitioner_ids:
                  raise AssertionError(f"Practitioner catalog leaked across clinic {key}")
              forbidden = {"patients", "appointments", "calendar_id", "account_email", "events", "tokens"}
              if forbidden.intersection(page):
                  raise AssertionError("Public page exposed private top-level fields")

          booking_day = (date.today() + timedelta(days=1)).isoformat()
          cross_query = urllib.parse.urlencode(
              {
                  "service_id": b["service"]["id"],
                  "practitioner_id": b["practitioner"]["id"],
                  "booking_date": booking_day,
              }
          )
          expect("GET", f"/public/bookings/{a['slug']}/availability?{cross_query}", {404})
          expect(
              "PUT",
              "/integrations/online-booking",
              {422},
              {
                  "enabled": True,
                  "slug": a["slug"],
                  "service_ids": [b["service"]["id"]],
                  "practitioner_ids": [b["practitioner"]["id"]],
              },
              a["token"],
          )

          def availability(clinic):
              query = urllib.parse.urlencode(
                  {
                      "service_id": clinic["service"]["id"],
                      "practitioner_id": clinic["practitioner"]["id"],
                      "booking_date": booking_day,
                  }
              )
              _, payload = expect(
                  "GET",
                  f"/public/bookings/{clinic['slug']}/availability?{query}",
                  {200},
              )
              return payload

          for clinic in (a, b):
              slots = {item["start"] for item in availability(clinic)["slots"]}
              if not {"10:00", "11:00", "12:00"}.issubset(slots):
                  raise AssertionError("Expected independent staging availability is missing")

          def booking_payload(clinic, start, key, patient_id=None):
              payload = {
                  "service_id": clinic["service"]["id"],
                  "practitioner_id": clinic["practitioner"]["id"],
                  "booking_date": booking_day,
                  "start": start,
                  "first_name": "Paciente",
                  "last_name": "Aislado Test",
                  "phone": "611222333",
                  "email": "paciente-aislado@example.com",
                  "notes": "Observacion publica de prueba",
                  "idempotency_key": key,
              }
              if patient_id:
                  payload["patient_id"] = patient_id
              return payload

          _, booking_a = expect(
              "POST",
              f"/public/bookings/{a['slug']}",
              {201},
              booking_payload(a, "12:00", "staging-multiclinic-a-0001"),
          )
          _, booking_b = expect(
              "POST",
              f"/public/bookings/{b['slug']}",
              {201},
              booking_payload(b, "12:00", "staging-multiclinic-b-0001"),
          )
          if booking_a["appointment_id"] == booking_b["appointment_id"]:
              raise AssertionError("Appointments were mixed across clinics")
          if booking_a["clinic"] != "CLINICA GOOGLE TEST A" or booking_b["clinic"] != "CLINICA GOOGLE TEST B":
              raise AssertionError("Booking resolved to the wrong clinic")

          _, patients_a = expect("GET", "/patients", {200}, token=a["token"])
          _, patients_b = expect("GET", "/patients", {200}, token=b["token"])
          ids_a = {item["id"] for item in patients_a}
          ids_b = {item["id"] for item in patients_b}
          if ids_a.intersection(ids_b):
              raise AssertionError("Patient identities leaked across clinics")
          patient_b_id = next(item["id"] for item in patients_b if item["email"] == "paciente-aislado@example.com")

          _, injected = expect(
              "POST",
              f"/public/bookings/{a['slug']}",
              {201},
              booking_payload(a, "13:00", "staging-patient-injection-0001", patient_b_id),
          )
          _, appointments_a = expect("GET", "/appointments", {200}, token=a["token"])
          _, appointments_b = expect("GET", "/appointments", {200}, token=b["token"])
          ids_appointments_a = {item["id"] for item in appointments_a}
          ids_appointments_b = {item["id"] for item in appointments_b}
          if booking_a["appointment_id"] not in ids_appointments_a or booking_b["appointment_id"] in ids_appointments_a:
              raise AssertionError("Agenda A contains the wrong clinic appointment")
          if booking_b["appointment_id"] not in ids_appointments_b or booking_a["appointment_id"] in ids_appointments_b:
              raise AssertionError("Agenda B contains the wrong clinic appointment")
          injected_row = next(item for item in appointments_a if item["id"] == injected["appointment_id"])
          if injected_row["patient_id"] == patient_b_id:
              raise AssertionError("Public patient_id injection crossed clinics")

          cross_body = booking_payload(a, "10:00", "staging-cross-resource-0001")
          cross_body["service_id"] = b["service"]["id"]
          cross_body["practitioner_id"] = b["practitioner"]["id"]
          expect("POST", f"/public/bookings/{a['slug']}", {409}, cross_body)

          def reserve_concurrently(index):
              return request(
                  "POST",
                  f"/public/bookings/{a['slug']}",
                  booking_payload(a, "11:00", f"staging-concurrent-{index}-0001"),
              )

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              concurrent_results = list(executor.map(reserve_concurrently, (1, 2)))
          statuses = sorted(status for status, _ in concurrent_results)
          if statuses != [201, 409]:
              raise AssertionError(f"Concurrent booking guard failed: {statuses}")

          _, appointments_a = expect("GET", "/appointments", {200}, token=a["token"])
          concurrent_rows = [
              item for item in appointments_a
              if item["date"] == booking_day and item["start"] == "11:00"
          ]
          if len(concurrent_rows) != 1:
              raise AssertionError("Concurrent booking created duplicate appointments")

          report = {
              "health": health_status,
              "clinic_a_id": a["id"],
              "clinic_b_id": b["id"],
              "default_optional": True,
              "catalog_isolation": True,
              "cross_service_rejected": True,
              "cross_practitioner_rejected": True,
              "cross_patient_rejected": True,
              "patient_ids_distinct": True,
              "agenda_isolation": True,
              "independent_bookings": True,
              "double_booking_statuses": statuses,
              "production_requests": 0,
          }
          print("STAGING_MULTI_CLINIC_E2E=" + json.dumps(report, sort_keys=True))
          PY
